name: Build

on:
  push:
    branches: [main]
    # Documentation-only changes don't need new builds.
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an older build, so an old APK can never overwrite
# the test release after a newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Every APK is signed with the same upload key, so a new build installs
      # over the previous one. Without the secrets (e.g. pull requests from
      # forks) Gradle falls back to the throwaway debug key.
      - name: Set up release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] \
            || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Android signing secrets are missing; the APKs are signed with a debug key and will not install over earlier builds."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "storeFile=$KEYSTORE"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release
      - name: Rename universal APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LifeOS-Kupler.apk
      # A much smaller APK for modern (64-bit ARM) phones.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Rename arm64 APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LifeOS-Kupler-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Kupler-android
          path: |
            LifeOS-Kupler.apk
            LifeOS-Kupler-arm64.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the game folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "LifeOS-Kupler" | Out-Null
          Copy-Item -Recurse -Path "build/windows/x64/runner/Release/*" -Destination "LifeOS-Kupler"
          Compress-Archive -Path "LifeOS-Kupler" -DestinationPath "LifeOS-Kupler-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Kupler-windows
          path: LifeOS-Kupler-Windows.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package (tar.gz with desktop entry and icon)
        run: |
          mkdir -p LifeOS-Kupler
          cp -r build/linux/x64/release/bundle/. LifeOS-Kupler/
          # Named after the application id so desktops match the window to
          # its entry (and icon).
          cp packaging/linux/com.lifeos.lifeos_kupler.desktop LifeOS-Kupler/
          cp linux/runner/resources/app_icon.png LifeOS-Kupler/com.lifeos.lifeos_kupler.png
          cp LICENSE LifeOS-Kupler/
          tar -czf LifeOS-Kupler-Linux-x64.tar.gz LifeOS-Kupler
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Kupler-linux
          path: LifeOS-Kupler-Linux-x64.tar.gz

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Android: LifeOS-Kupler-arm64.apk (küçük, modern telefonlar) ya da LifeOS-Kupler.apk (tüm telefonlar) dosyasını telefonun tarayıcısından indirip kurun; bilinmeyen kaynaklara izin vermeniz gerekebilir.
          Windows: LifeOS-Kupler-Windows.zip dosyasını bir klasöre çıkarın ve lifeos_kupler.exe dosyasını çalıştırın. SmartScreen uyarırsa 'Ek bilgi' > 'Yine de çalıştır' deyin.
          Linux: LifeOS-Kupler-Linux-x64.tar.gz dosyasını açıp LifeOS-Kupler/lifeos_kupler dosyasını çalıştırın (gtk3 ve GStreamer gerekir). Arch Linux için depodaki packaging/arch/PKGBUILD ile: makepkg -si
          Bu derlemeler test içindir; mağazaya yüklenemez. Sürüm: ${GITHUB_SHA::7}"
          # Update the existing release in place instead of deleting and
          # recreating it (recreating moves the tag, which GitHub can refuse).
          if gh release view test-build >/dev/null 2>&1; then
            gh release upload test-build LifeOS-Kupler.apk LifeOS-Kupler-arm64.apk LifeOS-Kupler-Windows.zip LifeOS-Kupler-Linux-x64.tar.gz --clobber
            gh release edit test-build --title "Test sürümü (${GITHUB_SHA::7})" --notes "$NOTES" --prerelease
          else
            gh release create test-build LifeOS-Kupler.apk LifeOS-Kupler-arm64.apk LifeOS-Kupler-Windows.zip LifeOS-Kupler-Linux-x64.tar.gz \
              --target "$GITHUB_SHA" --prerelease --title "Test sürümü (${GITHUB_SHA::7})" --notes "$NOTES"
          fi
