name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LifeOS-Kupler.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Kupler-android
          path: LifeOS-Kupler.apk
      - name: Publish test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build LifeOS-Kupler.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test sürümü (${GITHUB_SHA::7})" \
            --notes "Telefonda denemek için LifeOS-Kupler.apk dosyasını indirip kurun. Bilinmeyen kaynaklardan yüklemeye izin vermeniz gerekebilir. Bu derleme hata ayıklama anahtarıyla imzalanmıştır; mağazaya yüklenemez."
